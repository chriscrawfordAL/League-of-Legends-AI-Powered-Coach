# Databricks Asset Bundle: the ingestion job + the Dash app.
#
# Deploy:  databricks bundle deploy  -t dev --profile default
# Run app: databricks bundle run league_ai_coach -t dev --profile default
# (deploy uploads code; run applies config and starts the app.)
#
# Fill the variables below (warehouse id, serving endpoint, secret scope) before
# deploying. Resource IDs must NOT be hardcoded in source — they live here.
bundle:
  name: league-ai-coach

variables:
  warehouse_id:
    description: SQL warehouse id the app queries gold tables through.
    default: "f3846cabca43f2d1"   # Serverless Starter (fevm-central1)
  serving_endpoint:
    description: FMAPI chat endpoint name.
    default: databricks-claude-sonnet-4-6
  secret_scope:
    description: Secret scope holding the Riot API key.
    default: league_ai_coach

resources:
  jobs:
    ingest_matches:
      name: league-ai-coach-ingest
      tasks:
        - task_key: ingest
          spark_python_task:
            python_file: jobs/ingest_matches.py
            # Serverless tasks can't take env vars; pass the UC destination +
            # default pull settings as params (app-triggered runs send their own).
            parameters:
              - "--catalog"
              - "fevm_central1"
              - "--schema"
              - "league_ai_coach"
              - "--queue-mode"
              - "both"
              - "--count"
              - "25"
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "2"
            dependencies:
              - requests>=2.32.0
      # Scheduled ingestion (also triggerable on demand by the app). Paused:
      # the dev Riot key expires every 24h, so we run on-demand via the app's
      # Refresh button. Flip to UNPAUSED once a non-expiring (prod) key is set.
      schedule:
        quartz_cron_expression: "0 0 */6 * * ?"  # every 6 hours
        timezone_id: America/Los_Angeles
        pause_status: PAUSED

  apps:
    league_ai_coach:
      name: league-ai-coach
      source_code_path: .
      description: "League of Legends AI coach (analyzed player set per-request)."
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: ingest-job
          job:
            id: ${resources.jobs.ingest_matches.id}
            permission: CAN_MANAGE_RUN
        # Lakebase (Postgres) instance holding the synced gold-benchmark tables.
        # Declaring it provisions the app SP a Postgres role + injects PG* env vars.
        - name: lakebase
          database:
            instance_name: league-ai-coach-db
            database_name: databricks_postgres
            permission: CAN_CONNECT_AND_CREATE
        - name: riot-api-key
          secret:
            scope: ${var.secret_scope}
            key: riot_api_key
            # READ injects the key as RIOT_API_KEY. The first-run setup wizard's
            # "enter a Riot key" fallback WRITES this secret, which needs a WRITE
            # ACL on the scope for the app SP (not expressible here) — grant it at
            # deploy:  databricks secrets put-acl <scope> <app-sp-app-id> WRITE
            # The wizard also creates schemas via the SQL warehouse, so the app SP
            # needs CREATE SCHEMA on any target catalog:
            #   GRANT CREATE SCHEMA ON CATALOG <catalog> TO `<app-sp-app-id>`
            permission: READ
      config:
        command:
          - python
          - app/app.py
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: SERVING_ENDPOINT
            value_from: serving-endpoint
          - name: INGEST_JOB_ID
            value_from: ingest-job
          - name: RIOT_API_KEY
            value_from: riot-api-key
          - name: UC_CATALOG
            value: "fevm_central1"
          - name: UC_SCHEMA
            value: "league_ai_coach"
          # Lakebase instance name — used to mint fresh Postgres OAuth tokens at
          # runtime (the injected PGPASSWORD is short-lived and would go stale).
          - name: LAKEBASE_INSTANCE
            value: "league-ai-coach-db"
          - name: BENCHMARK_TIER
            value: "GOLD"
          - name: QUEUE_MODE
            value: "both"
          - name: MATCH_FETCH_COUNT
            value: "25"

targets:
  dev:
    default: true
    mode: development
    # NOTE: the default "direct" deployment engine (CLI v1.16.1) panics
    # (nil-pointer in ResourceApp.OverrideChangeDesc) when planning this app
    # resource on the FIRST deploy to a fresh workspace. Work around it only for
    # that initial create by forcing the classic engine:
    #   DATABRICKS_BUNDLE_ENGINE=terraform databricks bundle deploy -t dev ...
    # Subsequent updates work on the default engine.
